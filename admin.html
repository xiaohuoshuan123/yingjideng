<head>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

        .stat-card .stat-value { font-size: 36px; font-weight: bold; color: #667eea; }
        .stat-card .stat-label { font-size: 14px; color: #6c757d; margin-top: 4px; }
        .stat-card .stat-icon { font-size: 40px; color: #e9ecef; float: right; }
        .chart-container { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .chart-container h5 { margin-bottom: 16px; color: #333; }
        .table-container { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .btn-action { margin-right: 8px; }
        .no-data { text-align: center; padding: 40px; color: #6c757d; }
        .no-data i { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
        .nav-back { color: white; text-decoration: none; opacity: 0.8; }

        @media (max-width: 768px) {
            .stat-card .stat-value { font-size: 28px; }
            .stat-card .stat-icon { font-size: 32px; }
        }
    </style><!-- Canonical URL -->

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yingjideng.dpdns.org/admin.html">
    <meta property="og:title" content="yingjideng — AI 增强工具导航站">
    <meta property="og:description" content="传统工具 × AI 增强，一站找到最适合你的效率方案。300+ 在线工具，涵盖开发、设计、办公、学习等领域。">
    <meta property="og:image" content="https://yingjideng.dpdns.org/og-image.svg">
    <meta property="og:site_name" content="yingjideng">
    <meta property="og:locale" content="zh_CN">
    
    <!-- Twitter Card -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://yingjideng.dpdns.org/admin.html">
    <meta property="twitter:title" content="yingjideng — AI 增强工具导航站">
    <meta property="twitter:description" content="传统工具 × AI 增强，一站找到最适合你的效率方案。300+ 在线工具，涵盖开发、设计、办公、学习等领域。">
    <meta property="twitter:image" content="https://yingjideng.dpdns.org/og-image.svg">
    
    <!-- 资源预连接 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preload" href="data/tools.json" as="fetch" crossorigin>
    
    <!-- 结构化数据 (Schema.org) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "yingjideng — AI 增强工具导航站",
      "url": "https://yingjideng.dpdns.org/admin.html",
      "description": "传统工具 × AI 增强，一站找到最适合你的效率方案。"
    }
    </script>
    
    <!-- Cloudflare Web Analytics -->
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "0f77e2b4ac524c57b2fa258c43968d10"}'></script>
</head>
<body>

<!-- Header -->
<div class="header">
    <div class="container">
        <a href="index.html" class="nav-back"><i class="fas fa-arrow-left"></i> 返回首页</a>
        <h1 style="margin-top: 16px;"><i class="fas fa-chart-line"></i> 数据分析面板</h1>
        <p>访问统计 · 工具热度 · 搜索分析</p>
    </div>
</div>

<div class="container">

    <!-- 操作按钮 -->
    <div class="row mb-3">
        <div class="col-12">
            <button class="btn btn-outline-primary btn-action" onclick="window.yingjidengAnalytics.exportStats()">
                <i class="fas fa-download"></i> 导出数据
            </button>
            <label class="btn btn-outline-secondary btn-action">
                <i class="fas fa-upload"></i> 导入数据
                <input type="file" accept=".json" style="display:none" onchange="window.yingjidengAnalytics.importStats(this.files[0])">
            </label>
            <a href="import-export.html" class="btn btn-outline-info btn-action">
                <i class="fas fa-exchange-alt"></i> 批量导入/导出
            </a>
            <button class="btn btn-outline-danger btn-action" onclick="clearStats()">
                <i class="fas fa-trash"></i> 清空数据
            </button>
        </div>
    </div>

    <!-- 核心指标卡片 -->
    <div class="row">
        <div class="col-md-3 col-6">
            <div class="stat-card">
                <span class="stat-icon"><i class="fas fa-eye"></i></span>
                <div class="stat-value" id="stat-pv">0</div>
                <div class="stat-label">总访问量 (PV)</div>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="stat-card">
                <span class="stat-icon"><i class="fas fa-users"></i></span>
                <div class="stat-value" id="stat-uv">0</div>
                <div class="stat-label">独立访客 (UV)</div>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="stat-card">
                <span class="stat-icon"><i class="fas fa-mouse-pointer"></i></span>
                <div class="stat-value" id="stat-clicks">0</div>
                <div class="stat-label">工具点击次数</div>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="stat-card">
                <span class="stat-icon"><i class="fas fa-search"></i></span>
                <div class="stat-value" id="stat-search">0</div>
                <div class="stat-label">搜索次数</div>
            </div>
        </div>
    </div>

    <!-- 图表区域 -->
    <div class="row">
        <!-- 工具点击排行 -->
        <div class="col-md-8">
            <div class="chart-container">
                <h5><i class="fas fa-trophy"></i> 工具点击排行 TOP 10</h5>
                <canvas id="chart-tools" height="100"></canvas>
            </div>
        </div>
        <!-- 分类热度 -->
        <div class="col-md-4">
            <div class="chart-container">
                <h5><i class="fas fa-th-large"></i> 分类热度分布</h5>
                <canvas id="chart-categories" height="200"></canvas>
            </div>
        </div>
    </div>

    <div class="row">
        <!-- 搜索关键词 -->
        <div class="col-md-8">
            <div class="chart-container">
                <h5><i class="fas fa-key"></i> 搜索关键词 TOP 10</h5>
                <canvas id="chart-search" height="100"></canvas>
            </div>
        </div>
        <!-- 访问趋势 -->
        <div class="col-md-4">
            <div class="chart-container">
                <h5><i class="fas fa-calendar"></i> 近7天访问量</h5>
                <canvas id="chart-trend" height="200"></canvas>
            </div>
        </div>
    </div>

    <!-- 详细数据表格 -->
    <div class="table-container">
        <h5><i class="fas fa-table"></i> 工具点击详情</h5>
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>排名</th>
                        <th>工具名称</th>
                        <th>点击次数</th>
                        <th>占比</th>
                    </tr>
                </thead>
                <tbody id="table-tools"></tbody>
            </table>
        </div>
    </div>

    <!-- 无数据提示 -->
    <div id="no-data" class="no-data" style="display:none;">
        <i class="fas fa-chart-bar"></i>
        <h5>暂无统计数据</h5>
        <p>开始使用网站后，数据会自动收集</p>
    </div>

</div>

<script src="js/analytics.js?v=9"></script>
<script>
// ============================================
// 等待 analytics 加载完成
// ============================================
const analyticsScript = document.createElement('script');
analyticsScript.src = 'js/analytics.js';
document.head.appendChild(analyticsScript);

// ============================================
// 等待 analytics 加载完成
// ============================================
let statsLoaded = false;
function tryRender() {
    if (!window.yingjidengAnalytics || statsLoaded) return;
    renderDashboard();
    statsLoaded = true;
}
analyticsScript.onload = tryRender;
setInterval(tryRender, 100);

// ============================================
// 渲染仪表盘
// ============================================
function renderDashboard() {
    const stats = window.yingjidengAnalytics.getStats();

    // 检查是否有数据
    const totalClicks = Object.values(stats.toolClicks || {}).reduce((a, b) => a + b, 0);
    const totalSearches = Object.values(stats.searchKeywords || {}).reduce((a, b) => a + b, 0);

    if (!stats.pageViews || stats.pageViews === 0) {
        document.getElementById('no-data').style.display = 'block';
        return;
    }

    document.getElementById('no-data').style.display = 'none';

    // 核心指标
    document.getElementById('stat-pv').textContent = stats.pageViews || 0;
    document.getElementById('stat-uv').textContent = Object.keys(stats.uniqueVisitors || {}).length;
    document.getElementById('stat-clicks').textContent = totalClicks;
    document.getElementById('stat-search').textContent = totalSearches;

    // 工具点击排行
    renderToolChart(stats.toolClicks || {});

    // 分类热度
    renderCategoryChart(stats.categoryHits || {});

    // 搜索关键词
    renderSearchChart(stats.searchKeywords || {});

    // 访问趋势
    renderTrendChart(stats.uniqueVisitors || {});

    // 详情表格
    renderTable(stats.toolClicks || {});
}

// ============================================
// 工具点击图表
// ============================================
function renderToolChart(toolClicks) {
    const sorted = Object.entries(toolClicks)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 10);

    if (sorted.length === 0) return;

    new Chart(document.getElementById('chart-tools'), {
        type: 'bar',
        data: {
            labels: sorted.map(([id]) => id),
            datasets: [{
                data: sorted.map(([, count]) => count),
                backgroundColor: 'rgba(102, 126, 234, 0.8)',
                borderRadius: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { beginAtZero: true, ticks: { precision: 0 } }
            }
        }
    });
}

// ============================================
// 分类热度图表
// ============================================
function renderCategoryChart(categoryHits) {
    const sorted = Object.entries(categoryHits)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 8);

    if (sorted.length === 0) return;

    new Chart(document.getElementById('chart-categories'), {
        type: 'doughnut',
        data: {
            labels: sorted.map(([cat]) => cat),
            datasets: [{
                data: sorted.map(([, count]) => count),
                backgroundColor: [
                    '#667eea', '#764ba2', '#f093fb', '#4facfe',
                    '#00f2fe', '#43e97b', '#fa709a', '#fee140'
                ]
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { position: 'bottom', labels: { padding: 12, boxWidth: 10 } }
            }
        }
    });
}

// ============================================
// 搜索关键词图表
// ============================================
function renderSearchChart(searchKeywords) {
    const sorted = Object.entries(searchKeywords)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 10);

    if (sorted.length === 0) return;

    new Chart(document.getElementById('chart-search'), {
        type: 'bar',
        data: {
            labels: sorted.map(([kw]) => kw),
            datasets: [{
                data: sorted.map(([, count]) => count),
                backgroundColor: 'rgba(79, 172, 254, 0.8)',
                borderRadius: 4
            }]
        },
        options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { beginAtZero: true, ticks: { precision: 0 } }
            }
        }
    });
}

// ============================================
// 访问趋势图表
// ============================================
function renderTrendChart(uniqueVisitors) {
    // 获取近7天数据
    const days = [];
    const values = [];
    for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const dateStr = d.toISOString().slice(0, 10);
        days.push(dateStr.slice(5)); // MM-DD
        values.push(uniqueVisitors[dateStr] || 0);
    }

    if (values.every(v => v === 0)) return;

    new Chart(document.getElementById('chart-trend'), {
        type: 'line',
        data: {
            labels: days,
            datasets: [{
                data: values,
                borderColor: '#667eea',
                backgroundColor: 'rgba(102, 126, 234, 0.1)',
                fill: true,
                tension: 0.3,
                pointRadius: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { beginAtZero: true, ticks: { precision: 0 } }
            }
        }
    });
}

// ============================================
// 详情表格
// ============================================
function renderTable(toolClicks) {
    const sorted = Object.entries(toolClicks)
        .sort((a, b) => b[1] - a[1]);

    const total = sorted.reduce((sum, [, count]) => sum + count, 0);
    const tbody = document.getElementById('table-tools');

    if (sorted.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">暂无数据</td></tr>';
        return;
    }

    tbody.innerHTML = sorted.slice(0, 20).map(([id, count], i) => `
        <tr>
            <td>${i + 1}</td>
            <td>${escapeHtml(id)}</td>
            <td>${count}</td>
            <td>${total > 0 ? ((count / total) * 100).toFixed(1) : 0}%</td>
        </tr>
    `).join('');
}

// ============================================
// 清空数据
// ============================================
function clearStats() {
    if (!confirm('确定清空所有统计数据吗？此操作不可恢复。')) return;
    localStorage.removeItem('yingjideng_stats');
    location.reload();
}

// ============================================
// 转义 HTML
// ============================================
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>

</body>
</html>
